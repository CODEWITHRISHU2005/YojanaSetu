spring.application.name=YojanaSetu

# Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview
spring.ai.google.genai.chat.options.max-tokens=2048
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
# Only HTTPS grounding links on these government domains are shown as official sources.
# Override with a comma-separated allowlist in production.
yojana.official-source-domains=${OFFICIAL_SOURCE_DOMAINS:gov.in,nic.in,india.gov.in,myscheme.gov.in}

# MongoDB Atlas Vector Search Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=yojanasetu
spring.ai.vectorstore.mongodb.collection-name=yojanasetu_vectors
spring.ai.vectorstore.mongodb.metadata-fields-to-filter=source
spring.ai.vectorstore.mongodb.initialize-schema=true

# Development Tools
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
