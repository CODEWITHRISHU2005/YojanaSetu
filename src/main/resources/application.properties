spring.application.name=YojanaSetu

# Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview
spring.ai.google.genai.chat.options.max-tokens=2048
spring.ai.google.genai.chat.options.temperature=0.5
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

#MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.ai.vectorstore.mongodb.collection-name=mflix
spring.ai.vectorstore.mongodb.initialize-schema=true

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=on_param