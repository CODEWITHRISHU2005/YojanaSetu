<!DOCTYPE html>
<html lang="en">
<head>
    <title>Yojana-Setu - Government Scheme Assistant</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-app: #ffffff;
            --bg-chat: #f8fafc;
            --bg-input: #ffffff;
            --bg-bubble-bot: #f1f5f9;
            --bg-bubble-user: #2563eb;
            --bg-hover: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-bubble-bot: #1e293b;
            --text-bubble-user: #ffffff;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --success: #10b981;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-app: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        body.dark {
            --bg-body: #020617;
            --bg-app: #0f172a;
            --bg-chat: #020617;
            --bg-input: #0f172a;
            --bg-bubble-bot: #1e293b;
            --bg-bubble-user: #3b82f6;
            --bg-hover: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-bubble-bot: #f1f5f9;
            --text-bubble-user: #ffffff;
            --border-color: #1e293b;
            --shadow-app: 0 25px 50px -12px rgb(0 0 0 / 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.05), transparent 40%),
            radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.05), transparent 40%);
            z-index: 0;
            pointer-events: none;
        }
        body.dark .ambient-bg {
            background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.1), transparent 40%),
            radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.1), transparent 40%);
        }
        #root {
            width: 100%;
            height: 100%;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
        .btn-icon {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 8px;
            border: 1px solid transparent; background: transparent;
            color: var(--text-secondary); cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-icon.active { color: var(--primary); background: rgba(37, 99, 235, 0.1); }
        input:focus { outline: none; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>
<div class="ambient-bg"></div>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { motion, AnimatePresence } = Motion;
    const API_BASE_URL = 'http://localhost:8080';

    const Icons = {
        Bot: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>,
        User: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
        Send: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
        Mic: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>,
        Paperclip: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>,
        Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
        Sun: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
        Moon: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
        Volume: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
        VolumeX: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>,
        Globe: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
        Shield: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
        Briefcase: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
        Graduation: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>,
        Heart: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
        Home: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    };

    const translations = {
        en: {
            appTitle: 'Yojana-Setu',
            appSubtitle: 'Government Scheme Assistant',
            placeholder: 'Ask about any government scheme...',
            welcomeTitle: 'How can I help you today?',
            welcomeSubtitle: 'Ask me anything about eligibility, benefits, or the application process for Indian government schemes.',
            uploadSuccess: 'Document attached. Extracting text...',
            uploadError: 'Upload failed. Please ensure the file is valid.',
            ocrSuccess: 'Text extracted from document',
        },
        hi: {
            appTitle: 'योजना-सेतु',
            appSubtitle: 'सरकारी योजना सहायक',
            placeholder: 'किसी भी सरकारी योजना के बारे में पूछें...',
            welcomeTitle: 'आज मैं आपकी कैसे मदद कर सकता हूँ?',
            welcomeSubtitle: 'भारतीय सरकारी योजनाओं के लिए पात्रता, लाभ या आवेदन प्रक्रिया के बारे में कुछ भी पूछें।',
            uploadSuccess: 'दस्तावेज़ संलग्न। टेक्स्ट निकाला जा रहा है...',
            uploadError: 'अपलोड विफल। कृपया सुनिश्चित करें कि फ़ाइल मान्य है।',
            ocrSuccess: 'दस्तावेज़ से टेक्स्ट निकाला गया',
        }
    };

    const schemeSuggestions = [
        { id: 1, icon: <Icons.Briefcase />, title: 'PM Kisan Samman Nidhi', query: 'Tell me about PM Kisan Yojana' },
        { id: 2, icon: <Icons.Graduation />, title: 'Student Scholarships', query: 'What are the scholarship schemes for students?' },
        { id: 3, icon: <Icons.Heart />, title: 'Ayushman Bharat', query: 'How to apply for Ayushman Bharat health card?' },
        { id: 4, icon: <Icons.Home />, title: 'PM Awas Yojana', query: 'Am I eligible for PM Awas Yojana housing scheme?' }
    ];

    function YojanaSetu() {
        const [messages, setMessages] = useState([]);
        const [inputValue, setInputValue] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const [language, setLanguage] = useState('en');
        const [darkMode, setDarkMode] = useState(false);
        const [voiceEnabled, setVoiceEnabled] = useState(true);
        const [isListening, setIsListening] = useState(false);

        const chatBoxRef = useRef(null);
        const fileInputRef = useRef(null);
        const recognitionRef = useRef(null);

        const t = (key) => translations[language]?.[key] || translations['en'][key];

        useEffect(() => {
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }, [darkMode]);

        useEffect(() => {
            if (chatBoxRef.current) {
                chatBoxRef.current.scrollTop = chatBoxRef.current.scrollHeight;
            }
        }, [messages, isTyping]);

        const addMessage = useCallback((content, isUser = false) => {
            setMessages(prev => [...prev, { id: Date.now(), content, isUser, timestamp: new Date() }]);
        }, []);

        const handleVoiceToggle = () => {
            setVoiceEnabled(prevState => {
                const newState = !prevState;
                if (!newState && window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                return newState;
            });
        };

        const sendMessage = async () => {
            if (!inputValue.trim()) return;
            const userMessage = inputValue;
            setInputValue('');
            addMessage(userMessage, true);
            setIsTyping(true);

            try {
                const response = await fetch(`${API_BASE_URL}/api/chat/ask?message=${encodeURIComponent(userMessage)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'text/plain' }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.text();

                if (data && data.trim()) {
                    addMessage(data, false);
                    if (voiceEnabled && window.speechSynthesis) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(data);
                        utterance.lang = language === 'hi' ? 'hi-IN' : 'en-IN';
                        window.speechSynthesis.speak(utterance);
                    }
                }
            } catch (error) {
                console.error('API Error:', error);
                addMessage("I'm having trouble connecting to the server right now. Please ensure the backend is running.", false);
            } finally {
                setIsTyping(false);
            }
        };

        const handleVoice = () => {
            if (!('webkitSpeechRecognition' in window)) {
                alert('Voice input is not supported in this browser.');
                return;
            }
            if (isListening) {
                recognitionRef.current?.stop();
                return;
            }
            const recognition = new webkitSpeechRecognition();
            recognition.lang = language === 'hi' ? 'hi-IN' : 'en-US';
            recognition.onstart = () => setIsListening(true);
            recognition.onend = () => setIsListening(false);
            recognition.onresult = (e) => setInputValue(e.results[0][0].transcript);
            recognitionRef.current = recognition;
            recognition.start();
        };

        const handleFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            addMessage(t('uploadSuccess'), false);
            setIsTyping(true);

            try {
                const imageUrl = URL.createObjectURL(file);
                const result = await Tesseract.recognize(imageUrl, 'eng+hin');
                URL.revokeObjectURL(imageUrl);

                if (result.data.text.trim()) {
                    setInputValue((prev) => prev + " [Attached Text: " + result.data.text.substring(0, 100) + "...] ");
                }
            } catch (error) {
                addMessage(t('uploadError'), false);
            } finally {
                setIsTyping(false);
            }
        };

        return (
            <div style={{
                width: '100%', maxWidth: '1000px', height: 'calc(100vh - 48px)',
                background: 'var(--bg-app)', borderRadius: '24px',
                boxShadow: 'var(--shadow-app)', display: 'flex', flexDirection: 'column',
                overflow: 'hidden', border: '1px solid var(--border-color)'
            }}>
                <header style={{
                    padding: '20px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                    borderBottom: '1px solid var(--border-color)', background: 'var(--bg-app)', zIndex: 10
                }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                        <div style={{
                            width: '40px', height: '40px', borderRadius: '10px',
                            background: 'rgba(37, 99, 235, 0.1)', display: 'flex',
                            alignItems: 'center', justifyContent: 'center'
                        }}>
                            <Icons.Shield />
                        </div>
                        <div>
                            <h1 style={{ fontSize: '18px', fontWeight: '600', color: 'var(--text-primary)', margin: 0 }}>{t('appTitle')}</h1>
                            <p style={{ fontSize: '13px', color: 'var(--text-secondary)', margin: 0 }}>{t('appSubtitle')}</p>
                        </div>
                    </div>

                    <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                        <div style={{
                            display: 'flex', alignItems: 'center', gap: '6px',
                            padding: '6px 12px', borderRadius: '20px',
                            border: '1px solid var(--border-color)', background: 'var(--bg-chat)'
                        }}>
                            <Icons.Globe />
                            <select
                                value={language} onChange={(e) => setLanguage(e.target.value)}
                                style={{ border: 'none', background: 'transparent', fontSize: '13px', fontWeight: '500', color: 'var(--text-primary)', cursor: 'pointer' }}
                            >
                                <option value="en">English</option>
                                <option value="hi">हिंदी</option>
                            </select>
                        </div>

                        <button className={`btn-icon ${voiceEnabled ? 'active' : ''}`} onClick={handleVoiceToggle} title={voiceEnabled ? "Mute Voice" : "Enable Voice"}>
                            {voiceEnabled ? <Icons.Volume /> : <Icons.VolumeX />}
                        </button>
                        <button className="btn-icon" onClick={() => setDarkMode(!darkMode)} title="Toggle Theme">
                            {darkMode ? <Icons.Moon /> : <Icons.Sun />}
                        </button>
                        <button className="btn-icon" onClick={() => setMessages([])} title="Clear Chat">
                            <Icons.Trash />
                        </button>
                    </div>
                </header>

                <div ref={chatBoxRef} style={{ flex: 1, overflowY: 'auto', background: 'var(--bg-chat)', padding: '24px' }}>
                    {messages.length === 0 ? (
                        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', maxWidth: '600px', margin: '0 auto' }}>
                            <div style={{ marginBottom: '24px', color: 'var(--primary)', opacity: 0.8 }}><Icons.Shield /></div>
                            <h2 style={{ fontSize: '24px', fontWeight: '600', marginBottom: '12px', color: 'var(--text-primary)' }}>{t('welcomeTitle')}</h2>
                            <p style={{ fontSize: '15px', color: 'var(--text-secondary)', textAlign: 'center', marginBottom: '40px', lineHeight: '1.5' }}>{t('welcomeSubtitle')}</p>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', width: '100%' }}>
                                {schemeSuggestions.map(s => (
                                    <button key={s.id} onClick={() => { setInputValue(s.query); setTimeout(sendMessage, 50); }}
                                            style={{
                                                padding: '16px', borderRadius: '12px', border: '1px solid var(--border-color)',
                                                background: 'var(--bg-app)', display: 'flex', alignItems: 'center', gap: '12px',
                                                cursor: 'pointer', textAlign: 'left', transition: 'all 0.2s', color: 'var(--text-primary)'
                                            }}
                                            onMouseOver={(e) => e.currentTarget.style.borderColor = 'var(--primary)'}
                                            onMouseOut={(e) => e.currentTarget.style.borderColor = 'var(--border-color)'}
                                    >
                                        <div style={{ color: 'var(--primary)' }}>{s.icon}</div>
                                        <span style={{ fontSize: '14px', fontWeight: '500' }}>{s.title}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', maxWidth: '800px', margin: '0 auto' }}>
                            <AnimatePresence>
                                {messages.map(msg => (
                                    <motion.div key={msg.id}
                                                initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }}
                                                style={{ display: 'flex', gap: '12px', flexDirection: msg.isUser ? 'row-reverse' : 'row' }}
                                    >
                                        <div style={{
                                            width: '32px', height: '32px', borderRadius: '8px', flexShrink: 0,
                                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                                            background: msg.isUser ? 'var(--primary)' : 'var(--border-color)',
                                            color: msg.isUser ? '#fff' : 'var(--text-secondary)'
                                        }}>
                                            {msg.isUser ? <Icons.User /> : <Icons.Bot />}
                                        </div>
                                        <div style={{
                                            padding: '12px 16px', borderRadius: '12px', maxWidth: '80%',
                                            fontSize: '15px', lineHeight: '1.5', whiteSpace: 'pre-wrap',
                                            background: msg.isUser ? 'var(--bg-bubble-user)' : 'var(--bg-bubble-bot)',
                                            color: msg.isUser ? 'var(--text-bubble-user)' : 'var(--text-bubble-bot)',
                                            border: msg.isUser ? 'none' : '1px solid var(--border-color)',
                                            borderTopRightRadius: msg.isUser ? '4px' : '12px',
                                            borderTopLeftRadius: msg.isUser ? '12px' : '4px'
                                        }}>
                                            {msg.content}
                                        </div>
                                    </motion.div>
                                ))}
                                {isTyping && (
                                    <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} style={{ display: 'flex', gap: '12px' }}>
                                        <div style={{ width: '32px', height: '32px', borderRadius: '8px', background: 'var(--border-color)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)' }}><Icons.Bot /></div>
                                        <div style={{ padding: '16px', borderRadius: '12px', background: 'var(--bg-bubble-bot)', display: 'flex', gap: '4px' }}>
                                            <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'var(--text-secondary)', animation: 'pulse 1s infinite' }}></span>
                                            <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'var(--text-secondary)', animation: 'pulse 1s infinite 0.2s' }}></span>
                                            <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'var(--text-secondary)', animation: 'pulse 1s infinite 0.4s' }}></span>
                                        </div>
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        </div>
                    )}
                </div>

                <div style={{ padding: '20px 24px', background: 'var(--bg-app)', borderTop: '1px solid var(--border-color)' }}>
                    <div style={{
                        display: 'flex', alignItems: 'center', gap: '8px', background: 'var(--bg-body)',
                        padding: '8px', borderRadius: '16px', border: '1px solid var(--border-color)'
                    }}>
                        <button className="btn-icon" onClick={() => fileInputRef.current?.click()}>
                            <Icons.Paperclip />
                        </button>
                        <input type="file" ref={fileInputRef} style={{ display: 'none' }} onChange={handleFileUpload} accept="image/*,application/pdf" />

                        <input
                            value={inputValue} onChange={e => setInputValue(e.target.value)}
                            onKeyPress={e => e.key === 'Enter' && sendMessage()}
                            placeholder={t('placeholder')}
                            style={{ flex: 1, border: 'none', background: 'transparent', fontSize: '15px', color: 'var(--text-primary)', padding: '0 8px' }}
                        />

                        <button className={`btn-icon ${isListening ? 'active' : ''}`} onClick={handleVoice}>
                            <Icons.Mic />
                        </button>

                        <button onClick={sendMessage} disabled={!inputValue.trim()} style={{
                            width: '40px', height: '40px', borderRadius: '10px', border: 'none',
                            background: inputValue.trim() ? 'var(--primary)' : 'var(--border-color)',
                            color: inputValue.trim() ? '#ffffff' : 'var(--text-secondary)',
                            display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: inputValue.trim() ? 'pointer' : 'default',
                            transition: 'all 0.2s'
                        }}>
                            <Icons.Send />
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<YojanaSetu />);
</script>
</body>
</html>
