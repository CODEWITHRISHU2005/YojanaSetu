<!DOCTYPE html>
<html lang="en">
<head>
    <title>Yojana-Setu - Government Scheme Assistant</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">

    <!-- React & Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>

    <!-- Tesseract.js for OCR -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Light Theme */
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border: #e5e7eb;
            --shadow-color: rgba(0, 0, 0, 0.1);

            /* Dark Theme */
            --dark-bg-primary: #0f1419;
            --dark-bg-secondary: #1a1f29;
            --dark-bg-tertiary: #242b38;
            --dark-text-primary: #f3f4f6;
            --dark-text-secondary: #9ca3af;
            --dark-text-tertiary: #6b7280;
            --dark-border: #2d3748;
            --dark-shadow-color: rgba(0, 0, 0, 0.5);

            /* Accent Colors */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background: var(--gradient-1);
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.3s ease;
        }

        body.dark {
            background: linear-gradient(135deg, #1a1f29 0%, #0f1419 100%);
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--gradient-2);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--gradient-3);
            bottom: -250px;
            right: -250px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: particle-float 15s linear infinite;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        #root {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass {
            background: rgba(15, 20, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(203, 213, 225, 0.5);
            border-radius: 10px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.7);
        }

        /* Shimmer effect */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        .shimmer {
            background: linear-gradient(90deg,
            transparent 0%,
            rgba(255, 255, 255, 0.2) 50%,
            transparent 100%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }

        /* Pulse animation */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* Glow effect */
        .glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        .dark .glow {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.7);
        }

        /* Ripple effect */
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
<div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>
</div>
<div id="root"></div>

<script>
    // Create particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        particlesContainer.appendChild(particle);
    }
</script>

<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { motion, AnimatePresence } = Motion;

    // ========== BACKEND CONFIGURATION ==========
    // Change this to your Spring Boot backend URL
    const API_BASE_URL = 'http://localhost:8080';  // ⚠️ Update this if your backend runs on different port
    // ===========================================

    // Language translations
    const translations = {
        en: {
            appTitle: 'Yojana-Setu',
            appSubtitle: 'Your Intelligent Government Scheme Assistant',
            aiActive: 'AI Assistant Active',
            placeholder: 'Type your message...',
            listening: 'Listening...',
            welcomeTitle: '🙏 Namaste! I\'m here to help with government schemes',
            welcomeSubtitle: 'Ask me anything about schemes, eligibility, or application process',
            voiceEnabled: '🔊 Voice responses enabled',
            voiceDisabled: '🔇 Voice responses disabled',
            uploadSuccess: '✅ Document uploaded! Extracting text...',
            uploadError: '❌ Upload failed. Please try again.',
            ocrProcessing: '🔄 Processing with OCR...',
            ocrSuccess: '✅ Text extracted successfully',
            clearConfirm: 'Clear chat history?',
            darkMode: 'Dark Mode',
            lightMode: 'Light Mode'
        },
        hi: {
            appTitle: 'योजना-सेतु',
            appSubtitle: 'आपका बुद्धिमान सरकारी योजना सहायक',
            aiActive: 'AI सहायक सक्रिय',
            placeholder: 'अपना संदेश लिखें...',
            listening: 'सुन रहा हूँ...',
            welcomeTitle: '🙏 नमस्ते! मैं यहाँ सरकारी योजनाओं में मदद के लिए हूँ',
            welcomeSubtitle: 'योजनाओं, पात्रता या आवेदन के बारे में कुछ भी पूछें',
            voiceEnabled: '🔊 आवाज प्रतिक्रिया सक्षम',
            voiceDisabled: '🔇 आवाज प्रतिक्रिया बंद',
            uploadSuccess: '✅ दस्तावेज़ अपलोड! टेक्स्ट निकाला जा रहा है...',
            uploadError: '❌ अपलोड विफल। पुनः प्रयास करें।',
            ocrProcessing: '🔄 OCR से प्रोसेस हो रहा है...',
            ocrSuccess: '✅ टेक्स्ट सफलतापूर्वक निकाला गया',
            clearConfirm: 'चैट इतिहास साफ़ करें?',
            darkMode: 'डार्क मोड',
            lightMode: 'लाइट मोड'
        }
    };

    // Quick actions
    const quickActions = [
        { id: 1, icon: '💰', text: 'PM Kisan', query: 'PM Kisan Yojana details', gradient: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)' },
        { id: 2, icon: '📚', text: 'Scholarship', query: 'student scholarship schemes', gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)' },
        { id: 3, icon: '🏥', text: 'Health', query: 'health insurance schemes', gradient: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)' },
        { id: 4, icon: '🏠', text: 'Housing', query: 'housing schemes', gradient: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)' }
    ];

    // Scheme suggestions
    const schemeSuggestions = [
        { id: 1, icon: '💰', title: 'PM Kisan Yojana', subtitle: 'Financial Benefits for Farmers', color: '#f093fb' },
        { id: 2, icon: '📚', title: 'Scholarships', subtitle: 'Education Support', color: '#4facfe' },
        { id: 3, icon: '🏥', title: 'Ayushman Bharat', subtitle: 'Health Insurance', color: '#43e97b' },
        { id: 4, icon: '🏠', title: 'PMAY', subtitle: 'Housing Scheme', color: '#fa709a' }
    ];

    // Main App Component
    function YojanaSetu() {
        const [messages, setMessages] = useState([]);
        const [inputValue, setInputValue] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const [language, setLanguage] = useState('en');
        const [darkMode, setDarkMode] = useState(false);
        const [voiceEnabled, setVoiceEnabled] = useState(true);
        const [isListening, setIsListening] = useState(false);
        const [uploadedDocs, setUploadedDocs] = useState([]);

        const chatBoxRef = useRef(null);
        const recognitionRef = useRef(null);
        const fileInputRef = useRef(null);

        const t = (key) => translations[language]?.[key] || translations['en'][key];

        // Toggle dark mode
        useEffect(() => {
            if (darkMode) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }, [darkMode]);

        // Scroll to bottom
        const scrollToBottom = () => {
            if (chatBoxRef.current) {
                chatBoxRef.current.scrollTop = chatBoxRef.current.scrollHeight;
            }
        };

        useEffect(() => {
            scrollToBottom();
        }, [messages]);

        // Add message
        const addMessage = useCallback((content, isUser = false) => {
            const newMessage = {
                id: Date.now(),
                content,
                isUser,
                timestamp: new Date()
            };
            setMessages(prev => [...prev, newMessage]);
        }, []);

        // Send message
        const sendMessage = async () => {
            if (!inputValue.trim()) return;

            const userMessage = inputValue;
            setInputValue('');
            addMessage(userMessage, true);

            setIsTyping(true);

            try {
                // Call Spring Boot backend API
                console.log('Sending message to backend:', userMessage);

                const response = await fetch(`${API_BASE_URL}/api/chat/ask?message=${encodeURIComponent(userMessage)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'text/plain'
                    }
                });

                console.log('Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.text();
                console.log('Response data:', data);

                if (data && data.trim()) {
                    addMessage(data, false);

                    // Speak if voice enabled
                    if (voiceEnabled) {
                        speakText(data);
                    }
                } else {
                    throw new Error('Empty response from server');
                }
            } catch (error) {
                console.error('Backend API Error:', error);
                addMessage(`❌ Unable to connect to backend at ${API_BASE_URL}. Please ensure:\n• Backend is running on port 8080\n• CORS is enabled\n• Network connection is active`, false);
            } finally {
                setIsTyping(false);
            }
        };

        // Voice input
        const startListening = () => {
            if (!('webkitSpeechRecognition' in window)) {
                addMessage('⚠️ Voice input not supported.', false);
                return;
            }

            const recognition = new webkitSpeechRecognition();
            recognition.lang = language === 'hi' ? 'hi-IN' : 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => setIsListening(true);
            recognition.onend = () => setIsListening(false);

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                setInputValue(transcript);
            };

            recognition.onerror = () => {
                setIsListening(false);
            };

            recognitionRef.current = recognition;
            recognition.start();
        };

        // Text-to-Speech
        const speakText = (text) => {
            if (!voiceEnabled || !window.speechSynthesis) return;

            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        };

        // Document upload
        const handleFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                addMessage('❌ File too large. Max 10MB.', false);
                return;
            }

            addMessage(t('uploadSuccess'), false);
            setIsTyping(true);

            try {
                const imageUrl = URL.createObjectURL(file);
                const result = await Tesseract.recognize(imageUrl, 'eng+hin');
                const text = result.data.text;

                URL.revokeObjectURL(imageUrl);

                if (text && text.trim()) {
                    setUploadedDocs(prev => [...prev, {
                        name: file.name,
                        text: text,
                        timestamp: new Date()
                    }]);

                    addMessage(`${t('ocrSuccess')}:\n\n"${text.substring(0, 200)}${text.length > 200 ? '...' : ''}"`, false);
                } else {
                    addMessage('⚠️ No text found.', false);
                }
            } catch (error) {
                addMessage(t('uploadError'), false);
            } finally {
                setIsTyping(false);
            }
        };

        // Quick action click
        const handleQuickAction = (query) => {
            setInputValue(query);
            setTimeout(sendMessage, 100);
        };

        // Clear chat
        const clearChat = () => {
            if (confirm(t('clearConfirm'))) {
                setMessages([]);
                setUploadedDocs([]);
            }
        };

        const getStyles = () => ({
            container: {
                width: '100%',
                height: '100%',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center'
            },
            app: {
                width: '100%',
                maxWidth: '1000px',
                height: 'calc(100vh - 32px)',
                borderRadius: '32px',
                boxShadow: darkMode
                    ? '0 25px 80px rgba(0, 0, 0, 0.5)'
                    : '0 25px 80px rgba(0, 0, 0, 0.15)',
                display: 'flex',
                flexDirection: 'column',
                overflow: 'hidden'
            },
            header: {
                padding: '28px 36px',
                borderBottom: `1px solid ${darkMode ? 'var(--dark-border)' : 'var(--border)'}`,
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                background: darkMode
                    ? 'rgba(26, 31, 41, 0.8)'
                    : 'linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(250,251,252,0.9) 100%)',
                backdropFilter: 'blur(20px)'
            },
            headerLeft: {
                display: 'flex',
                alignItems: 'center',
                gap: '20px'
            },
            headerRight: {
                display: 'flex',
                alignItems: 'center',
                gap: '12px'
            },
            logo: {
                fontSize: '56px',
                cursor: 'pointer',
                filter: 'drop-shadow(0 4px 12px rgba(99, 102, 241, 0.3))'
            },
            title: {
                fontSize: '28px',
                fontWeight: '800',
                background: 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)',
                WebkitBackgroundClip: 'text',
                WebkitTextFillColor: 'transparent',
                backgroundClip: 'text',
                margin: 0,
                letterSpacing: '-0.5px'
            },
            subtitle: {
                fontSize: '15px',
                color: darkMode ? 'var(--dark-text-secondary)' : 'var(--text-secondary)',
                margin: 0,
                fontWeight: '500'
            },
            quickActions: {
                padding: '16px 36px',
                display: 'flex',
                gap: '12px',
                flexWrap: 'wrap',
                borderBottom: `1px solid ${darkMode ? 'var(--dark-border)' : 'var(--border)'}`,
                background: darkMode ? 'rgba(26, 31, 41, 0.5)' : 'rgba(255, 255, 255, 0.5)'
            },
            chatContainer: {
                flex: 1,
                overflow: 'hidden',
                background: darkMode
                    ? 'linear-gradient(180deg, #1a1f29 0%, #0f1419 100%)'
                    : 'linear-gradient(180deg, #fafbfc 0%, #f8f9fa 100%)'
            },
            chatBox: {
                height: '100%',
                overflowY: 'auto',
                padding: '28px 36px'
            },
            inputContainer: {
                padding: '24px 36px',
                borderTop: `1px solid ${darkMode ? 'var(--dark-border)' : 'var(--border)'}`,
                background: darkMode
                    ? 'rgba(26, 31, 41, 0.8)'
                    : 'rgba(255, 255, 255, 0.8)',
                backdropFilter: 'blur(20px)'
            },
            inputWrapper: {
                display: 'flex',
                alignItems: 'center',
                gap: '12px',
                background: darkMode ? 'var(--dark-bg-tertiary)' : '#f3f4f6',
                borderRadius: '28px',
                padding: '6px',
                border: `2px solid transparent`,
                transition: 'all 0.3s ease'
            },
            input: {
                flex: 1,
                border: 'none',
                background: 'transparent',
                fontSize: '15px',
                outline: 'none',
                padding: '0 12px',
                color: darkMode ? 'var(--dark-text-primary)' : 'var(--text-primary)'
            }
        });

        const styles = getStyles();

        return (
            <div style={styles.container}>
                <motion.div
                    className="glass"
                    style={styles.app}
                    initial={{ opacity: 0, scale: 0.95, y: 20 }}
                    animate={{ opacity: 1, scale: 1, y: 0 }}
                    transition={{ duration: 0.5, ease: [0.68, -0.55, 0.265, 1.55] }}
                >
                    <Header
                        language={language}
                        setLanguage={setLanguage}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                        voiceEnabled={voiceEnabled}
                        setVoiceEnabled={setVoiceEnabled}
                        clearChat={clearChat}
                        t={t}
                        styles={styles}
                    />

                    <QuickActions
                        actions={quickActions}
                        onAction={handleQuickAction}
                        darkMode={darkMode}
                        styles={styles}
                    />

                    <div style={styles.chatContainer}>
                        <div style={styles.chatBox} ref={chatBoxRef}>
                            {messages.length === 0 ? (
                                <WelcomeScreen
                                    suggestions={schemeSuggestions}
                                    onSuggestionClick={handleQuickAction}
                                    darkMode={darkMode}
                                    t={t}
                                />
                            ) : (
                                <AnimatePresence>
                                    {messages.map(msg => (
                                        <Message key={msg.id} message={msg} darkMode={darkMode} />
                                    ))}
                                </AnimatePresence>
                            )}

                            {isTyping && <TypingIndicator darkMode={darkMode} />}
                        </div>
                    </div>

                    <InputArea
                        value={inputValue}
                        setValue={setInputValue}
                        onSend={sendMessage}
                        onVoice={startListening}
                        isListening={isListening}
                        onFileUpload={() => fileInputRef.current?.click()}
                        uploadCount={uploadedDocs.length}
                        placeholder={t('placeholder')}
                        darkMode={darkMode}
                        styles={styles}
                    />

                    <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        style={{ display: 'none' }}
                        onChange={handleFileUpload}
                    />
                </motion.div>
            </div>
        );
    }

    // Header Component
    function Header({ language, setLanguage, darkMode, setDarkMode, voiceEnabled, setVoiceEnabled, clearChat, t, styles }) {
        return (
            <div style={styles.header}>
                <div style={styles.headerLeft}>
                    <motion.div
                        style={styles.logo}
                        whileHover={{ scale: 1.1, rotate: 10 }}
                        whileTap={{ scale: 0.95 }}
                    >
                        🏛️
                    </motion.div>
                    <div>
                        <h1 style={styles.title}>{t('appTitle')}</h1>
                        <p style={styles.subtitle}>{t('appSubtitle')}</p>
                    </div>
                </div>

                <div style={styles.headerRight}>
                    <ThemeToggle darkMode={darkMode} setDarkMode={setDarkMode} />

                    <select
                        style={{
                            padding: '10px 16px',
                            border: `1px solid ${darkMode ? 'var(--dark-border)' : 'var(--border)'}`,
                            borderRadius: '24px',
                            background: darkMode ? 'var(--dark-bg-tertiary)' : 'white',
                            color: darkMode ? 'var(--dark-text-primary)' : 'var(--text-primary)',
                            fontSize: '14px',
                            fontWeight: '600',
                            cursor: 'pointer',
                            outline: 'none',
                            transition: 'all 0.2s'
                        }}
                        value={language}
                        onChange={(e) => setLanguage(e.target.value)}
                    >
                        <option value="en">🇬🇧 EN</option>
                        <option value="hi">🇮🇳 हिं</option>
                    </select>

                    <AnimatedIconButton onClick={() => setVoiceEnabled(!voiceEnabled)} darkMode={darkMode}>
                        {voiceEnabled ? '🔊' : '🔇'}
                    </AnimatedIconButton>

                    <AnimatedIconButton onClick={clearChat} darkMode={darkMode}>
                        🗑️
                    </AnimatedIconButton>
                </div>
            </div>
        );
    }

    // Theme Toggle Component
    function ThemeToggle({ darkMode, setDarkMode }) {
        return (
            <motion.button
                style={{
                    width: '56px',
                    height: '32px',
                    borderRadius: '16px',
                    background: darkMode
                        ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
                        : 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                    border: 'none',
                    cursor: 'pointer',
                    position: 'relative',
                    padding: '4px'
                }}
                onClick={() => setDarkMode(!darkMode)}
                whileTap={{ scale: 0.95 }}
            >
                <motion.div
                    style={{
                        width: '24px',
                        height: '24px',
                        borderRadius: '50%',
                        background: 'white',
                        position: 'absolute',
                        top: '4px',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        fontSize: '14px'
                    }}
                    animate={{ left: darkMode ? '28px' : '4px' }}
                    transition={{ type: 'spring', stiffness: 500, damping: 30 }}
                >
                    {darkMode ? '🌙' : '☀️'}
                </motion.div>
            </motion.button>
        );
    }

    // Quick Actions Component
    function QuickActions({ actions, onAction, darkMode, styles }) {
        return (
            <div style={styles.quickActions}>
                {actions.map((action, index) => (
                    <motion.button
                        key={action.id}
                        style={{
                            padding: '12px 24px',
                            border: 'none',
                            borderRadius: '100px',
                            background: action.gradient,
                            color: 'white',
                            fontSize: '14px',
                            fontWeight: '700',
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '8px',
                            boxShadow: '0 4px 15px rgba(0, 0, 0, 0.1)'
                        }}
                        onClick={() => onAction(action.query)}
                        initial={{ opacity: 0, x: -20 }}
                        animate={{ opacity: 1, x: 0 }}
                        transition={{ delay: index * 0.1, duration: 0.4 }}
                        whileHover={{ scale: 1.05, y: -3, boxShadow: '0 8px 25px rgba(0, 0, 0, 0.2)' }}
                        whileTap={{ scale: 0.98 }}
                    >
                        <span style={{ fontSize: '20px' }}>{action.icon}</span>
                        <span>{action.text}</span>
                    </motion.button>
                ))}
            </div>
        );
    }

    // Welcome Screen Component
    function WelcomeScreen({ suggestions, onSuggestionClick, darkMode, t }) {
        return (
            <motion.div
                style={{
                    textAlign: 'center',
                    padding: '48px 24px'
                }}
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
            >
                <motion.h2
                    style={{
                        fontSize: '32px',
                        fontWeight: '800',
                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                        WebkitBackgroundClip: 'text',
                        WebkitTextFillColor: 'transparent',
                        backgroundClip: 'text',
                        marginBottom: '16px'
                    }}
                    initial={{ scale: 0.9, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    transition={{ delay: 0.2, duration: 0.5 }}
                >
                    {t('welcomeTitle')}
                </motion.h2>

                <motion.p
                    style={{
                        fontSize: '16px',
                        color: darkMode ? 'var(--dark-text-secondary)' : 'var(--text-secondary)',
                        marginBottom: '40px',
                        maxWidth: '500px',
                        margin: '0 auto 40px'
                    }}
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    transition={{ delay: 0.4, duration: 0.5 }}
                >
                    {t('welcomeSubtitle')}
                </motion.p>

                <div style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))',
                    gap: '16px',
                    maxWidth: '800px',
                    margin: '0 auto'
                }}>
                    {suggestions.map((suggestion, index) => (
                        <motion.button
                            key={suggestion.id}
                            style={{
                                padding: '28px',
                                border: `2px solid ${darkMode ? 'var(--dark-border)' : 'var(--border)'}`,
                                borderRadius: '24px',
                                background: darkMode ? 'rgba(26, 31, 41, 0.5)' : 'rgba(255, 255, 255, 0.9)',
                                backdropFilter: 'blur(10px)',
                                cursor: 'pointer',
                                display: 'flex',
                                alignItems: 'flex-start',
                                gap: '20px',
                                textAlign: 'left',
                                position: 'relative',
                                overflow: 'hidden'
                            }}
                            onClick={() => onSuggestionClick(suggestion.title)}
                            initial={{ opacity: 0, y: 30 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: 0.5 + index * 0.1, duration: 0.5 }}
                            whileHover={{
                                scale: 1.03,
                                y: -5,
                                boxShadow: '0 12px 35px rgba(0, 0, 0, 0.15)',
                                borderColor: suggestion.color
                            }}
                            whileTap={{ scale: 0.98 }}
                        >
                            <motion.div
                                style={{
                                    fontSize: '40px',
                                    width: '64px',
                                    height: '64px',
                                    borderRadius: '20px',
                                    background: `linear-gradient(135deg, ${suggestion.color} 0%, ${suggestion.color}dd 100%)`,
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    flexShrink: 0,
                                    boxShadow: `0 8px 20px ${suggestion.color}50`
                                }}
                                whileHover={{ rotate: 10 }}
                            >
                                {suggestion.icon}
                            </motion.div>
                            <div style={{ flex: 1 }}>
                                <div style={{
                                    fontSize: '18px',
                                    fontWeight: '700',
                                    color: darkMode ? 'var(--dark-text-primary)' : 'var(--text-primary)',
                                    marginBottom: '6px'
                                }}>
                                    {suggestion.title}
                                </div>
                                <div style={{
                                    fontSize: '14px',
                                    color: darkMode ? 'var(--dark-text-secondary)' : 'var(--text-secondary)'
                                }}>
                                    {suggestion.subtitle}
                                </div>
                            </div>
                        </motion.button>
                    ))}
                </div>
            </motion.div>
        );
    }

    // Message Component
    function Message({ message, darkMode }) {
        return (
            <motion.div
                style={{
                    display: 'flex',
                    gap: '14px',
                    marginBottom: '24px',
                    maxWidth: '75%',
                    alignSelf: message.isUser ? 'flex-end' : 'flex-start',
                    marginLeft: message.isUser ? 'auto' : '0',
                    flexDirection: message.isUser ? 'row-reverse' : 'row'
                }}
                initial={{ opacity: 0, y: 20, scale: 0.95 }}
                animate={{ opacity: 1, y: 0, scale: 1 }}
                exit={{ opacity: 0, scale: 0.95 }}
                transition={{ duration: 0.4, ease: [0.68, -0.55, 0.265, 1.55] }}
            >
                <motion.div
                    style={{
                        width: '44px',
                        height: '44px',
                        borderRadius: '50%',
                        background: message.isUser
                            ? 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)'
                            : 'linear-gradient(135deg, #10b981 0%, #059669 100%)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        fontSize: '22px',
                        flexShrink: 0,
                        boxShadow: message.isUser
                            ? '0 8px 20px rgba(99, 102, 241, 0.4)'
                            : '0 8px 20px rgba(16, 185, 129, 0.4)'
                    }}
                    whileHover={{ scale: 1.1, rotate: 5 }}
                >
                    {message.isUser ? '👤' : '🤖'}
                </motion.div>

                <div style={{ flex: 1 }}>
                    <motion.div
                        style={{
                            padding: '16px 20px',
                            borderRadius: '20px',
                            background: message.isUser
                                ? 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)'
                                : darkMode
                                    ? 'rgba(26, 31, 41, 0.8)'
                                    : 'white',
                            color: message.isUser
                                ? 'white'
                                : darkMode
                                    ? 'var(--dark-text-primary)'
                                    : 'var(--text-primary)',
                            border: message.isUser
                                ? 'none'
                                : `1px solid ${darkMode ? 'var(--dark-border)' : 'var(--border)'}`,
                            fontSize: '15px',
                            lineHeight: '1.6',
                            whiteSpace: 'pre-wrap',
                            boxShadow: message.isUser
                                ? '0 4px 20px rgba(99, 102, 241, 0.3)'
                                : '0 4px 15px rgba(0, 0, 0, 0.08)',
                            backdropFilter: 'blur(10px)'
                        }}
                        whileHover={{ y: -2, boxShadow: '0 8px 25px rgba(0, 0, 0, 0.12)' }}
                    >
                        {message.content}
                    </motion.div>
                    <div style={{
                        fontSize: '12px',
                        color: darkMode ? 'var(--dark-text-tertiary)' : 'var(--text-tertiary)',
                        marginTop: '8px',
                        paddingLeft: '4px'
                    }}>
                        {message.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                    </div>
                </div>
            </motion.div>
        );
    }

    // Typing Indicator Component
    function TypingIndicator({ darkMode }) {
        return (
            <motion.div
                style={{
                    display: 'flex',
                    gap: '14px',
                    alignItems: 'center',
                    marginBottom: '24px',
                    maxWidth: '75%'
                }}
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
            >
                <div style={{
                    width: '44px',
                    height: '44px',
                    borderRadius: '50%',
                    background: 'linear-gradient(135deg, #10b981 0%, #059669 100%)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: '22px',
                    boxShadow: '0 8px 20px rgba(16, 185, 129, 0.4)'
                }}>
                    🤖
                </div>
                <div style={{
                    padding: '16px 20px',
                    background: darkMode ? 'rgba(26, 31, 41, 0.8)' : 'white',
                    borderRadius: '20px',
                    border: `1px solid ${darkMode ? 'var(--dark-border)' : 'var(--border)'}`,
                    display: 'flex',
                    gap: '8px',
                    backdropFilter: 'blur(10px)'
                }}>
                    {[0, 1, 2].map(i => (
                        <motion.span
                            key={i}
                            style={{
                                width: '10px',
                                height: '10px',
                                borderRadius: '50%',
                                background: darkMode ? '#9ca3af' : '#6b7280',
                                display: 'inline-block'
                            }}
                            animate={{ y: [-5, 0, -5] }}
                            transition={{
                                repeat: Infinity,
                                duration: 0.8,
                                delay: i * 0.15,
                                ease: 'easeInOut'
                            }}
                        />
                    ))}
                </div>
            </motion.div>
        );
    }

    // Input Area Component
    function InputArea({ value, setValue, onSend, onVoice, isListening, onFileUpload, uploadCount, placeholder, darkMode, styles }) {
        const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                onSend();
            }
        };

        return (
            <div style={styles.inputContainer}>
                <motion.div
                    style={styles.inputWrapper}
                    whileFocus={{
                        borderColor: '#6366f1',
                        boxShadow: '0 0 0 4px rgba(99, 102, 241, 0.1)'
                    }}
                >
                    <AnimatedIconButton onClick={onFileUpload} darkMode={darkMode} badge={uploadCount}>
                        ➕
                    </AnimatedIconButton>

                    <input
                        style={styles.input}
                        value={value}
                        onChange={(e) => setValue(e.target.value)}
                        onKeyPress={handleKeyPress}
                        placeholder={placeholder}
                    />

                    <AnimatedIconButton
                        onClick={onVoice}
                        darkMode={darkMode}
                        isListening={isListening}
                    >
                        🎙️
                    </AnimatedIconButton>

                    <motion.button
                        style={{
                            width: '48px',
                            height: '48px',
                            borderRadius: '50%',
                            border: 'none',
                            background: value.trim()
                                ? 'linear-gradient(135deg, #ec4899 0%, #f43f5e 100%)'
                                : darkMode ? '#374151' : '#d1d5db',
                            color: 'white',
                            fontSize: '20px',
                            cursor: value.trim() ? 'pointer' : 'not-allowed',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            boxShadow: value.trim() ? '0 4px 15px rgba(236, 72, 153, 0.4)' : 'none'
                        }}
                        onClick={onSend}
                        disabled={!value.trim()}
                        whileHover={value.trim() ? { scale: 1.05, boxShadow: '0 8px 25px rgba(236, 72, 153, 0.5)' } : {}}
                        whileTap={value.trim() ? { scale: 0.95 } : {}}
                    >
                        ⬆️
                    </motion.button>
                </motion.div>
            </div>
        );
    }

    // Animated Icon Button Component
    function AnimatedIconButton({ children, onClick, darkMode, badge, isListening }) {
        return (
            <motion.button
                style={{
                    width: '48px',
                    height: '48px',
                    borderRadius: '50%',
                    border: 'none',
                    background: darkMode ? '#374151' : 'transparent',
                    color: isListening ? '#ef4444' : darkMode ? '#9ca3af' : '#6b7280',
                    fontSize: '20px',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    position: 'relative'
                }}
                onClick={onClick}
                whileHover={{ scale: 1.1, background: darkMode ? '#4b5563' : '#f3f4f6' }}
                whileTap={{ scale: 0.95 }}
                animate={isListening ? { scale: [1, 1.1, 1] } : {}}
                transition={isListening ? { repeat: Infinity, duration: 1.5 } : {}}
            >
                {children}
                {badge > 0 && (
                    <motion.span
                        style={{
                            position: 'absolute',
                            top: '-4px',
                            right: '-4px',
                            background: 'linear-gradient(135deg, #ec4899 0%, #f43f5e 100%)',
                            color: 'white',
                            borderRadius: '50%',
                            width: '20px',
                            height: '20px',
                            fontSize: '12px',
                            fontWeight: '700',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            boxShadow: '0 2px 8px rgba(236, 72, 153, 0.4)'
                        }}
                        initial={{ scale: 0 }}
                        animate={{ scale: 1 }}
                        transition={{ type: 'spring', stiffness: 500 }}
                    >
                        {badge}
                    </motion.span>
                )}
            </motion.button>
        );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<YojanaSetu />);
</script>
</body>
</html>
